<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Черчение - 3 Вида, 3D и Размеры</title>
    <style>
        :root {
            --neon: #bf00ff;
            --bg: #050505;
            --accent: #00ffff;
            --red: #ff3333;
            --dim: #39ff14; /* Неоновый зеленый для размеров */
        }

        * {
            box-sizing: border-box;
        }

        html {
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(191, 0, 255, 0.14), transparent 34%),
                radial-gradient(circle at bottom right, rgba(255, 51, 51, 0.08), transparent 28%),
                var(--bg);
            color: #fff;
            font-family: "Segoe UI", Tahoma, sans-serif;
            overflow-x: hidden;
        }

        .container {
            width: min(1200px, 100%);
            margin: 0 auto;
            padding: clamp(12px, 2.6vw, 24px);
        }

        h2 {
            margin: 0 0 clamp(8px, 2.5vw, 15px);
            text-align: center;
            font-size: clamp(14px, 2.1vw, 28px);
            font-weight: 300;
            letter-spacing: clamp(1px, 0.22vw, 2px);
            color: var(--neon);
            text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon);
        }

        .hint {
            text-align: center;
            color: var(--accent);
            opacity: 0.8;
            font-size: clamp(12px, 1.5vw, 15px);
            margin-bottom: clamp(16px, 2vw, 25px);
            font-weight: 300;
        }

        .glass-panel {
            background: rgba(20, 20, 20, 0.42);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(191, 0, 255, 0.28);
            border-radius: clamp(14px, 2vw, 18px);
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.48),
                inset 0 0 24px rgba(191, 0, 255, 0.06);
            padding: clamp(14px, 2vw, 22px);
            margin-bottom: clamp(20px, 4vw, 40px);
        }

        #canvas3d {
            width: 100%;
            height: clamp(250px, 44vw, 500px);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(191, 0, 255, 0.45);
            box-shadow: 0 0 18px rgba(191, 0, 255, 0.26);
        }

        #canvas3d canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            touch-action: none;
        }

        .canvas-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        canvas.view-canvas {
            display: block;
            width: min(100%, 800px);
            height: auto;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: crosshair;
        }

        @media (max-width: 900px) {
            #canvas3d {
                height: clamp(250px, 62vw, 360px);
            }
        }

        @media (max-width: 560px) {
            .container {
                padding: 10px;
            }

            .glass-panel {
                padding: 12px;
            }

            #canvas3d {
                height: clamp(240px, 72vw, 320px);
            }
        }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div class="container">
        <div class="glass-panel">
            <h2>1. 3D-модель с сечением</h2>
            <div id="canvas3d"></div>
        </div>

        <div class="glass-panel">
            <h2>2. Ортогональные проекции</h2>
            <div class="canvas-wrapper">
                <canvas id="view2d" class="view-canvas" width="800" height="700"></canvas>
            </div>
        </div>

        <div class="glass-panel">
            <h2>3. Размеры деталей</h2>
            <div class="canvas-wrapper">
                <canvas id="view2d-dims" class="view-canvas" width="800" height="700"></canvas>
            </div>
        </div>

        <div class="glass-panel">
            <h2>4. Сечение</h2>
            <div class="canvas-wrapper">
                <canvas id="view2d-cut" class="view-canvas" width="800" height="700"></canvas>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- СЕКЦИЯ 1: 3D-сцена ---
        const container3d = document.getElementById('canvas3d');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);

        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
        const defaultViewDirection = new THREE.Vector3(155, 145, 215).normalize();

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.domElement.style.display = 'block';
        renderer.domElement.style.width = '100%';
        renderer.domElement.style.height = '100%';
        renderer.domElement.style.touchAction = 'none';
        container3d.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.rotateSpeed = 0.8;
        controls.zoomSpeed = 0.9;
        controls.minDistance = 120;
        controls.maxDistance = 520;

        const baseSize = 60;
        const baseHeight = 35;
        const cylRadius = 25;
        const cylHeight = 65;
        const baseHalfDiagonal = baseSize * Math.SQRT2 / 2;

        const edgeMaterial = new THREE.LineBasicMaterial({
            color: 0xbf00ff,
            transparent: true,
            opacity: 0.95,
            depthWrite: false,
            depthTest: false
        });

        const sectionFillMaterial = new THREE.MeshBasicMaterial({
            color: 0xff2f2f,
            transparent: true,
            opacity: 0.52,
            side: THREE.DoubleSide,
            depthWrite: false,
            depthTest: false
        });

        const sectionFrameMaterial = new THREE.LineBasicMaterial({
            color: 0xff4b4b,
            transparent: true,
            opacity: 1,
            depthWrite: false,
            depthTest: false
        });

        function createShellMaterials() {
            return {
                back: new THREE.MeshBasicMaterial({
                    color: 0x050505,
                    transparent: true,
                    opacity: 0.16,
                    side: THREE.BackSide,
                    depthWrite: false
                }),
                front: new THREE.MeshBasicMaterial({
                    color: 0x050505,
                    transparent: true,
                    opacity: 0.28,
                    side: THREE.FrontSide,
                    depthWrite: false
                })
            };
        }

        function buildGhostSolid(geometry, edgeGeometry = geometry, edgeThreshold) {
            const shell = new THREE.Group();
            const materials = createShellMaterials();

            const backMesh = new THREE.Mesh(geometry, materials.back);
            backMesh.renderOrder = 2;
            shell.add(backMesh);

            const frontMesh = new THREE.Mesh(geometry, materials.front);
            frontMesh.renderOrder = 2.1;
            shell.add(frontMesh);

            const edges = new THREE.LineSegments(
                new THREE.EdgesGeometry(edgeGeometry, edgeThreshold),
                edgeMaterial
            );
            edges.renderOrder = 4;
            shell.add(edges);

            return shell;
        }

        function createSectionGeometry(center, along, length, depth) {
            const across = new THREE.Vector3(0, 0, 1);
            const halfLength = length / 2;
            const halfDepth = depth / 2;

            const p1 = center.clone().addScaledVector(along, -halfLength).addScaledVector(across, -halfDepth);
            const p2 = center.clone().addScaledVector(along, halfLength).addScaledVector(across, -halfDepth);
            const p3 = center.clone().addScaledVector(along, halfLength).addScaledVector(across, halfDepth);
            const p4 = center.clone().addScaledVector(along, -halfLength).addScaledVector(across, halfDepth);

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute([
                p1.x, p1.y, p1.z, p2.x, p2.y, p2.z, p3.x, p3.y, p3.z, p4.x, p4.y, p4.z
            ], 3));
            geometry.setIndex([0, 1, 2, 0, 2, 3]);
            geometry.computeVertexNormals();

            return { geometry, corners: [p1, p2, p3, p4] };
        }

        const modelGroup = new THREE.Group();

        const baseGeometry = new THREE.BoxGeometry(baseSize, baseHeight, baseSize);
        const baseSolid = buildGhostSolid(baseGeometry);
        baseSolid.position.y = baseHeight / 2;
        baseSolid.rotation.y = Math.PI / 4;
        modelGroup.add(baseSolid);

        const cylinderGeometry = new THREE.CylinderGeometry(cylRadius, cylRadius, cylHeight, 48);
        const cylinderSolid = buildGhostSolid(cylinderGeometry, cylinderGeometry, 15);
        cylinderSolid.position.y = baseHeight + cylHeight / 2;
        modelGroup.add(cylinderSolid);

        const x1 = -baseHalfDiagonal;
        const y1 = baseHeight / 2;
        const x2 = cylRadius;
        const y2 = baseHeight + cylHeight / 2;

        const sectionCenter = new THREE.Vector3((x1 + x2) / 2, (y1 + y2) / 2, 0);
        const sectionDirection = new THREE.Vector3(x2 - x1, y2 - y1, 0).normalize();
        const sectionLength = Math.hypot(x2 - x1, y2 - y1) + 4;
        const sectionDepth = baseSize * Math.SQRT2 + 4;

        const { geometry: sectionGeometry, corners: sectionCorners } = createSectionGeometry(
            sectionCenter, sectionDirection, sectionLength, sectionDepth
        );

        const sectionMesh = new THREE.Mesh(sectionGeometry, sectionFillMaterial);
        sectionMesh.renderOrder = 1;
        modelGroup.add(sectionMesh);

        const sectionFrame = new THREE.LineLoop(
            new THREE.BufferGeometry().setFromPoints(sectionCorners),
            sectionFrameMaterial
        );
        sectionFrame.renderOrder = 5;
        modelGroup.add(sectionFrame);

        const pointSphere = new THREE.Mesh(
            new THREE.SphereGeometry(3, 20, 20),
            new THREE.MeshBasicMaterial({ color: 0x00ffff, depthWrite: false, depthTest: false })
        );
        pointSphere.renderOrder = 6;
        pointSphere.visible = false;
        modelGroup.add(pointSphere);

        modelGroup.position.y = -(baseHeight + cylHeight) / 2;
        scene.add(modelGroup);

        const bounds = new THREE.Box3();
        const viewSphere = new THREE.Sphere();
        const viewCenter = new THREE.Vector3();

        function frameModel() {
            bounds.setFromObject(modelGroup);
            bounds.getCenter(viewCenter);
            bounds.getBoundingSphere(viewSphere);

            const width = Math.max(container3d.clientWidth, 1);
            const height = Math.max(container3d.clientHeight, 1);
            const aspect = width / height;
            const halfFovY = THREE.MathUtils.degToRad(camera.fov * 0.5);
            const halfFovX = Math.atan(Math.tan(halfFovY) * aspect);
            const limitingHalfFov = Math.max(THREE.MathUtils.degToRad(8), Math.min(halfFovY, halfFovX));
            const distance = (viewSphere.radius / Math.sin(limitingHalfFov)) * 1.18;

            camera.position.copy(viewCenter).addScaledVector(defaultViewDirection, distance);
            camera.near = Math.max(0.1, distance / 100);
            camera.far = distance * 12;
            camera.lookAt(viewCenter);
            camera.updateProjectionMatrix();

            controls.target.copy(viewCenter);
            controls.update();
        }

        function resize3D() {
            const width = Math.max(container3d.clientWidth, 1);
            const height = Math.max(container3d.clientHeight, 1);
            camera.aspect = width / height;
            renderer.setSize(width, height, true);
            renderer.setViewport(0, 0, width, height);
            frameModel();
        }

        const resizeObserver = new ResizeObserver(resize3D);
        resizeObserver.observe(container3d);
        window.addEventListener('resize', resize3D, { passive: true });
        resize3D();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();


        // --- ОБЩИЕ ПЕРЕМЕННЫЕ ДЛЯ 2D ЧЕРТЕЖЕЙ ---
        const neonColor = '#bf00ff';
        const axisColor = 'rgba(255, 255, 255, 0.4)';
        const projColor = 'rgba(255, 255, 255, 0.15)';

        const cx = 400;
        const cy = 350;
        const scale = 1.5;

        const bW = baseSize * Math.SQRT2 * scale;
        const bH = baseHeight * scale;
        const cW = cylRadius * 2 * scale;
        const cH = cylHeight * scale;
        const halfBW = bW / 2;
        const halfCW = cW / 2;

        const frontX = cx - 180;
        const topY = cy + 150;
        const sideX = cx + 150;
        const baseY = cy - 40;

        const secX1 = x1 * scale;
        const secY1 = y1 * scale;
        const secX2 = x2 * scale;
        const secY2 = y2 * scale;
        const projDepth = halfBW;

        // Базовая функция отрисовки геометрии (без интерактива)
        function drawBaseGeometry(ctx) {
            ctx.beginPath();
            ctx.strokeStyle = axisColor;
            ctx.lineWidth = 1;
            ctx.moveTo(0, cy);
            ctx.lineTo(ctx.canvas.width, cy);
            ctx.moveTo(cx, 0);
            ctx.lineTo(cx, ctx.canvas.height);
            ctx.stroke();

            ctx.fillStyle = axisColor;
            ctx.font = '14px Arial';
            ctx.fillText('X', 20, cy - 10);
            ctx.fillText('Z', cx + 10, 20);
            ctx.fillText('Y', cx + 10, ctx.canvas.height - 20);
            ctx.fillText('Y', ctx.canvas.width - 20, cy - 10);

            ctx.beginPath();
            ctx.strokeStyle = projColor;
            ctx.setLineDash([5, 5]);
            ctx.moveTo(frontX, baseY); ctx.lineTo(sideX + halfBW + 20, baseY);
            ctx.moveTo(frontX, baseY - bH); ctx.lineTo(sideX + halfBW + 20, baseY - bH);
            ctx.moveTo(frontX, baseY - bH - cH); ctx.lineTo(sideX + halfCW + 20, baseY - bH - cH);
            ctx.moveTo(frontX - halfBW, topY); ctx.lineTo(frontX - halfBW, baseY - bH);
            ctx.moveTo(frontX + halfBW, topY); ctx.lineTo(frontX + halfBW, baseY - bH);
            ctx.arc(cx, cy, 150, 0, Math.PI / 2);
            ctx.moveTo(cx, cy + 150 + halfBW); ctx.arc(cx, cy, 150 + halfBW, 0, Math.PI / 2);
            ctx.moveTo(cx, cy + 150 - halfBW); ctx.arc(cx, cy, 150 - halfBW, 0, Math.PI / 2);
            ctx.moveTo(sideX, cy); ctx.lineTo(sideX, baseY - bH - cH);
            ctx.moveTo(sideX - halfBW, cy); ctx.lineTo(sideX - halfBW, baseY - bH);
            ctx.moveTo(sideX + halfBW, cy); ctx.lineTo(sideX + halfBW, baseY - bH);
            ctx.stroke();

            ctx.beginPath();
            ctx.strokeStyle = '#888';
            ctx.setLineDash([15, 5, 2, 5]);
            ctx.moveTo(frontX, baseY - bH - cH - 20); ctx.lineTo(frontX, topY + halfBW + 20);
            ctx.moveTo(frontX - halfBW - 20, topY); ctx.lineTo(frontX + halfBW + 20, topY);
            ctx.moveTo(sideX, baseY - bH - cH - 20); ctx.lineTo(sideX, cy + 20);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.strokeStyle = neonColor;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = neonColor;

            // Фронтальный вид
            ctx.strokeRect(frontX - halfBW, baseY - bH, bW, bH);
            ctx.strokeRect(frontX - halfCW, baseY - bH - cH, cW, cH);

            // Вид сверху (Ромб)
            ctx.beginPath();
            ctx.moveTo(frontX, topY - halfBW);
            ctx.lineTo(frontX + halfBW, topY);
            ctx.lineTo(frontX, topY + halfBW);
            ctx.lineTo(frontX - halfBW, topY);
            ctx.closePath();
            ctx.stroke();

            // Круг
            ctx.beginPath();
            ctx.arc(frontX, topY, halfCW, 0, Math.PI * 2);
            ctx.stroke();

            // Вид сбоку
            ctx.strokeRect(sideX - halfBW, baseY - bH, bW, bH);
            ctx.strokeRect(sideX - halfCW, baseY - bH - cH, cW, cH);
            ctx.beginPath();
            ctx.moveTo(sideX, baseY); ctx.lineTo(sideX, baseY - bH);
            ctx.moveTo(frontX, baseY); ctx.lineTo(frontX, baseY - bH);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Сечения
            ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(frontX + secX1, baseY - secY1);
            ctx.lineTo(frontX + secX2, baseY - secY2);
            ctx.stroke();

            ctx.fillRect(frontX + secX1, topY - projDepth, secX2 - secX1, projDepth * 2);
            ctx.strokeRect(frontX + secX1, topY - projDepth, secX2 - secX1, projDepth * 2);

            ctx.fillRect(sideX - projDepth, baseY - secY2, projDepth * 2, secY2 - secY1);
            ctx.strokeRect(sideX - projDepth, baseY - secY2, projDepth * 2, secY2 - secY1);
        }


        // --- СЕКЦИЯ 2: Точки связей (Оригинальная логика) ---
        const canvas2d = document.getElementById('view2d');
        const ctx2d = canvas2d.getContext('2d');
        let activePoint = null;

        function drawSection2() {
            ctx2d.clearRect(0, 0, canvas2d.width, canvas2d.height);
            drawBaseGeometry(ctx2d);

            if (activePoint) {
                const pxFront = frontX + activePoint.x * scale;
                const pyFront = baseY - activePoint.y * scale;
                const pxTop = frontX + activePoint.x * scale;
                const pyTop = topY + activePoint.z * scale;
                const pxSide = sideX + activePoint.z * scale;
                const pySide = baseY - activePoint.y * scale;

                ctx2d.beginPath();
                ctx2d.strokeStyle = '#00ffff';
                ctx2d.lineWidth = 1;
                ctx2d.setLineDash([4, 4]);
                ctx2d.moveTo(pxFront, pyFront); ctx2d.lineTo(pxTop, pyTop);
                ctx2d.moveTo(pxFront, pyFront); ctx2d.lineTo(pxSide, pySide);
                ctx2d.moveTo(pxTop, pyTop); ctx2d.lineTo(cx, pyTop);

                const arcRadius = pyTop - cy;
                if (arcRadius > 0) {
                    ctx2d.arc(cx, cy, arcRadius, Math.PI / 2, 0, true);
                } else {
                    ctx2d.arc(cx, cy, Math.abs(arcRadius), Math.PI / 2, 0, false);
                }

                ctx2d.lineTo(pxSide, pySide);
                ctx2d.stroke();
                ctx2d.setLineDash([]);

                ctx2d.fillStyle = '#00ffff';
                ctx2d.shadowBlur = 12;
                ctx2d.shadowColor = '#00ffff';

                [ [pxFront, pyFront], [pxTop, pyTop], [pxSide, pySide] ].forEach(([x, y]) => {
                    ctx2d.beginPath();
                    ctx2d.arc(x, y, 5, 0, Math.PI * 2);
                    ctx2d.fill();
                });
                ctx2d.shadowBlur = 0;
            }
        }

        drawSection2();

        canvas2d.addEventListener('click', (event) => {
            const rect = canvas2d.getBoundingClientRect();
            const mouseX = (event.clientX - rect.left) * (canvas2d.width / rect.width);
            const mouseY = (event.clientY - rect.top) * (canvas2d.height / rect.height);

            let locX = 0, locY = 0, locZ = 0, found = false;
            const margin = 15;

            if (mouseX > frontX - halfBW - margin && mouseX < frontX + halfBW + margin && mouseY > baseY - bH - cH - margin && mouseY < baseY + margin) {
                locX = (mouseX - frontX) / scale;
                locY = (baseY - mouseY) / scale;
                locY = Math.max(0, Math.min(100, locY));
                if (locY > baseHeight) { locZ = Math.abs(locX) <= cylRadius ? Math.sqrt(cylRadius ** 2 - locX ** 2) : 0; }
                else { const maxZ = baseHalfDiagonal; locZ = Math.abs(locX) <= maxZ ? maxZ - Math.abs(locX) : 0; }
                found = true;
            } else if (mouseX > frontX - halfBW - margin && mouseX < frontX + halfBW + margin && mouseY > topY - halfBW - margin && mouseY < topY + halfBW + margin) {
                locX = (mouseX - frontX) / scale;
                locZ = (mouseY - topY) / scale;
                if (locX ** 2 + locZ ** 2 <= cylRadius ** 2) { locY = baseHeight + cylHeight; }
                else if (Math.abs(locX) + Math.abs(locZ) <= baseHalfDiagonal) { locY = baseHeight; }
                else { locY = 0; }
                found = true;
            } else if (mouseX > sideX - halfBW - margin && mouseX < sideX + halfBW + margin && mouseY > baseY - bH - cH - margin && mouseY < baseY + margin) {
                locZ = (mouseX - sideX) / scale;
                locY = (baseY - mouseY) / scale;
                locY = Math.max(0, Math.min(100, locY));
                if (locY > baseHeight) { locX = Math.abs(locZ) <= cylRadius ? Math.sqrt(cylRadius ** 2 - locZ ** 2) : 0; }
                else { const maxX = baseHalfDiagonal; locX = Math.abs(locZ) <= maxX ? maxX - Math.abs(locZ) : 0; }
                found = true;
            }

            if (found) {
                activePoint = { x: locX, y: locY, z: locZ };
                pointSphere.position.set(locX, locY, locZ);
                pointSphere.visible = true;
            } else {
                activePoint = null;
                pointSphere.visible = false;
            }
            drawSection2();
        });


        // --- СЕКЦИЯ 3: Размеры (Новая логика) ---
        const canvasDims = document.getElementById('view2d-dims');
        const ctxDims = canvasDims.getContext('2d');

        // Расчет значений размеров из внутренних единиц (10 ед = 1 см)
        const vBaseDiag = (baseSize * Math.SQRT2 / 10).toFixed(1).replace('.', ','); // 8,5
        const vBaseSide = (baseSize / 10).toFixed(1).replace('.', ','); // 6,0
        const vBaseH = (baseHeight / 10).toFixed(1).replace('.', ','); // 3,5
        const vCylD = (cylRadius * 2 / 10).toFixed(1).replace('.', ','); // 5,0
        const vCylH = (cylHeight / 10).toFixed(1).replace('.', ','); // 6,5

        // Массив всех интерактивных линий. offset: отступ выносной линии (положительный - наружу/вниз/вправо)
        const dimLines = [
            // Фронтальный вид
            { x1: frontX - halfBW, y1: baseY, x2: frontX + halfBW, y2: baseY, val: vBaseDiag, offset: 25, active: false },
            { x1: frontX - halfBW, y1: baseY, x2: frontX - halfBW, y2: baseY - bH, val: vBaseH, offset: 25, active: false },
            { x1: frontX + halfBW, y1: baseY - bH, x2: frontX + halfBW, y2: baseY, val: vBaseH, offset: 25, active: false },
            { x1: frontX - halfCW, y1: baseY - bH, x2: frontX - halfCW, y2: baseY - bH - cH, val: vCylH, offset: 25, active: false },
            { x1: frontX + halfCW, y1: baseY - bH - cH, x2: frontX + halfCW, y2: baseY - bH, val: vCylH, offset: 25, active: false },
            { x1: frontX - halfCW, y1: baseY - bH - cH, x2: frontX + halfCW, y2: baseY - bH - cH, val: vCylD, offset: -25, active: false },

            // Вид сбоку
            { x1: sideX - halfBW, y1: baseY, x2: sideX + halfBW, y2: baseY, val: vBaseDiag, offset: 25, active: false },
            { x1: sideX - halfBW, y1: baseY, x2: sideX - halfBW, y2: baseY - bH, val: vBaseH, offset: 25, active: false },
            { x1: sideX + halfBW, y1: baseY - bH, x2: sideX + halfBW, y2: baseY, val: vBaseH, offset: 25, active: false },
            { x1: sideX - halfCW, y1: baseY - bH, x2: sideX - halfCW, y2: baseY - bH - cH, val: vCylH, offset: 25, active: false },
            { x1: sideX + halfCW, y1: baseY - bH - cH, x2: sideX + halfCW, y2: baseY - bH, val: vCylH, offset: 25, active: false },
            { x1: sideX - halfCW, y1: baseY - bH - cH, x2: sideX + halfCW, y2: baseY - bH - cH, val: vCylD, offset: -25, active: false },

            // Вид сверху
            { x1: frontX, y1: topY - halfBW, x2: frontX - halfBW, y2: topY, val: vBaseSide, offset: 25, active: false },
            { x1: frontX + halfBW, y1: topY, x2: frontX, y2: topY - halfBW, val: vBaseSide, offset: 25, active: false },
            { x1: frontX - halfBW, y1: topY, x2: frontX, y2: topY + halfBW, val: vBaseSide, offset: 25, active: false },
            { x1: frontX, y1: topY + halfBW, x2: frontX + halfBW, y2: topY, val: vBaseSide, offset: 25, active: false }
        ];

        const dimCircle = { cx: frontX, cy: topY, r: halfCW, val: '∅' + vCylD, active: false };

        // Математика: расстояние от точки до отрезка (для точного клика на мобилках)
        function pointToLineDist(px, py, x1, y1, x2, y2) {
            const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
            const dot = A * C + B * D;
            const lenSq = C * C + D * D;
            let param = -1;
            if (lenSq !== 0) param = dot / lenSq;
            let xx, yy;
            if (param < 0) { xx = x1; yy = y1; }
            else if (param > 1) { xx = x2; yy = y2; }
            else { xx = x1 + param * C; yy = y1 + param * D; }
            return Math.sqrt((px - xx) ** 2 + (py - yy) ** 2);
        }

        // Отрисовка инженерного размера с выносными линиями
        function drawEngineeringDim(ctx, x1, y1, x2, y2, text, offsetNorm) {
            ctx.save();
            ctx.strokeStyle = '#39ff14'; // Неоновый зеленый цвет для размеров
            ctx.fillStyle = '#39ff14';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([]);
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#39ff14';

            const dx = x2 - x1, dy = y2 - y1;
            const len = Math.hypot(dx, dy);
            const nx = -dy / len, ny = dx / len;

            const extX1 = x1 + nx * offsetNorm, extY1 = y1 + ny * offsetNorm;
            const extX2 = x2 + nx * offsetNorm, extY2 = y2 + ny * offsetNorm;

            // Выносные линии
            ctx.beginPath();
            ctx.moveTo(x1, y1); ctx.lineTo(extX1, extY1);
            ctx.moveTo(x2, y2); ctx.lineTo(extX2, extY2);
            ctx.stroke();

            // Основная размерная линия (немного не доходит до конца выносной)
            const dimLineOffset = offsetNorm * 0.8;
            const dimX1 = x1 + nx * dimLineOffset, dimY1 = y1 + ny * dimLineOffset;
            const dimX2 = x2 + nx * dimLineOffset, dimY2 = y2 + ny * dimLineOffset;

            ctx.beginPath();
            ctx.moveTo(dimX1, dimY1); ctx.lineTo(dimX2, dimY2);
            ctx.stroke();

            // Точки-ограничители (минимализм)
            ctx.beginPath();
            ctx.arc(dimX1, dimY1, 2.5, 0, Math.PI * 2);
            ctx.arc(dimX2, dimY2, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Текст
            ctx.font = '500 16px "Segoe UI"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const textX = x1 + (dx/2) + nx * (offsetNorm * 1.25);
            const textY = y1 + (dy/2) + ny * (offsetNorm * 1.25);
            
            ctx.fillText(text, textX, textY);
            ctx.restore();
        }

        function drawSection3() {
            ctxDims.clearRect(0, 0, canvasDims.width, canvasDims.height);
            drawBaseGeometry(ctxDims); // Отрисовываем основу без синих точек

            // Отрисовка размеров для активных линий
            dimLines.forEach(line => {
                if (line.active) {
                    // Подсветка самой линии (эффект свечения при клике)
                    ctxDims.save();
                    ctxDims.strokeStyle = '#39ff14';
                    ctxDims.lineWidth = 3;
                    ctxDims.shadowBlur = 15;
                    ctxDims.shadowColor = '#39ff14';
                    ctxDims.beginPath();
                    ctxDims.moveTo(line.x1, line.y1);
                    ctxDims.lineTo(line.x2, line.y2);
                    ctxDims.stroke();
                    ctxDims.restore();

                    // Отрисовка выносного размера
                    drawEngineeringDim(ctxDims, line.x1, line.y1, line.x2, line.y2, line.val, line.offset);
                }
            });

            // Отрисовка размера круга
            if (dimCircle.active) {
                ctxDims.save();
                ctxDims.strokeStyle = '#39ff14';
                ctxDims.fillStyle = '#39ff14';
                ctxDims.lineWidth = 1.5;
                ctxDims.shadowBlur = 8;
                ctxDims.shadowColor = '#39ff14';

                // Подсветка круга
                ctxDims.beginPath();
                ctxDims.arc(dimCircle.cx, dimCircle.cy, dimCircle.r, 0, Math.PI * 2);
                ctxDims.stroke();

                // Линия диаметра
                const a = Math.PI / 4; // Угол в 45 градусов
                const dx = Math.cos(a) * dimCircle.r, dy = Math.sin(a) * dimCircle.r;
                ctxDims.beginPath();
                ctxDims.moveTo(dimCircle.cx - dx, dimCircle.cy - dy);
                ctxDims.lineTo(dimCircle.cx + dx + 30, dimCircle.cy + dy + 30); // Вынос
                ctxDims.stroke();

                // Текст
                ctxDims.font = '500 16px "Segoe UI"';
                ctxDims.textAlign = 'left';
                ctxDims.textBaseline = 'bottom';
                ctxDims.fillText(dimCircle.val, dimCircle.cx + dx + 35, dimCircle.cy + dy + 25);
                ctxDims.restore();
            }
        }

        drawSection3();

        // Интерактив 3 секции (универсальный тап/клик)
        canvasDims.addEventListener('click', (e) => {
            const rect = canvasDims.getBoundingClientRect();
            const scaleX = canvasDims.width / rect.width;
            const scaleY = canvasDims.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            let clicked = false;

            // Проверка попадания в отрезок (хитбокс 20px для удобства пальцем)
            dimLines.forEach(line => {
                if (pointToLineDist(mouseX, mouseY, line.x1, line.y1, line.x2, line.y2) < 20) {
                    line.active = !line.active;
                    clicked = true;
                }
            });

            // Проверка попадания в круг
            const distToCenter = Math.hypot(mouseX - dimCircle.cx, mouseY - dimCircle.cy);
            if (Math.abs(distToCenter - dimCircle.r) < 20) {
                dimCircle.active = !dimCircle.active;
                clicked = true;
            }

            if (clicked) drawSection3();
        });

        // --- СЕКЦИЯ 4: Фигура после отсечения ---
        const canvasCut = document.getElementById('view2d-cut');
        const ctxCut = canvasCut.getContext('2d');

        // Параметры линии сечения (в внутренних единицах модели)
        const cutSlope = (y2 - y1) / (x2 - x1);
        // На уровне верха основания (y = baseHeight) сечение пересекает x:
        const xCutBaseTop = x1 + (baseHeight - y1) / cutSlope; // ≈ -18.83
        // y, при котором x_threshold = 0 (граница вертикальной части цилиндра в виде сбоку)
        const yEllipseStart = y1 + (0 - x1) * cutSlope; // ≈ 48.96

        function drawSection4() {
            const ctx = ctxCut;
            ctx.clearRect(0, 0, canvasCut.width, canvasCut.height);

            // Оси
            ctx.beginPath();
            ctx.strokeStyle = axisColor;
            ctx.lineWidth = 1;
            ctx.moveTo(0, cy); ctx.lineTo(ctx.canvas.width, cy);
            ctx.moveTo(cx, 0); ctx.lineTo(cx, ctx.canvas.height);
            ctx.stroke();

            ctx.fillStyle = axisColor;
            ctx.font = '14px Arial';
            ctx.fillText('X', 20, cy - 10);
            ctx.fillText('Z', cx + 10, 20);
            ctx.fillText('Y', cx + 10, ctx.canvas.height - 20);
            ctx.fillText('Y', ctx.canvas.width - 20, cy - 10);

            // Контуры остатка фигуры — фиолетовым
            ctx.strokeStyle = neonColor;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = neonColor;

            // ============ ВИД СПЕРЕДИ (front) ============
            // Основание-трапеция: левый-низ -> правый-низ -> правый-верх -> (xCutBaseTop, верх) -> наклонный срез -> (-baseHalfDiag, y1) -> закрыть
            ctx.beginPath();
            ctx.moveTo(frontX - halfBW, baseY);
            ctx.lineTo(frontX + halfBW, baseY);
            ctx.lineTo(frontX + halfBW, baseY - bH);
            ctx.lineTo(frontX + xCutBaseTop * scale, baseY - bH);
            ctx.lineTo(frontX + x1 * scale, baseY - y1 * scale);
            ctx.closePath();
            ctx.stroke();

            // Цилиндр-треугольник: (xCutBaseTop, верх основания) -> (cylR, верх основания) -> (cylR, y2) -> закрыть наклонным срезом
            ctx.beginPath();
            ctx.moveTo(frontX + xCutBaseTop * scale, baseY - bH);
            ctx.lineTo(frontX + x2 * scale, baseY - bH);
            ctx.lineTo(frontX + x2 * scale, baseY - y2 * scale);
            ctx.closePath();
            ctx.stroke();

            // ============ ВИД СВЕРХУ (top) ============
            // Полный ромб (контур основания не меняется при проекции)
            ctx.beginPath();
            ctx.moveTo(frontX, topY - halfBW);
            ctx.lineTo(frontX + halfBW, topY);
            ctx.lineTo(frontX, topY + halfBW);
            ctx.lineTo(frontX - halfBW, topY);
            ctx.closePath();
            ctx.stroke();

            // Сегмент окружности (оставшаяся часть цилиндра): хорда при x = xCutBaseTop, x ≥ xCutBaseTop
            const chordHalf = Math.sqrt(cylRadius * cylRadius - xCutBaseTop * xCutBaseTop);
            const chordAngle = Math.acos(xCutBaseTop / cylRadius); // угол от +X до точки хорды
            const xChord = frontX + xCutBaseTop * scale;
            ctx.beginPath();
            // дуга от верхней точки хорды (z<0 в модели — выше на canvas) через правую сторону к нижней
            ctx.arc(frontX, topY, halfCW, -chordAngle, chordAngle, false);
            // замыкаем хордой
            ctx.lineTo(xChord, topY - chordHalf * scale);
            ctx.stroke();

            // ============ ВИД СБОКУ (side) ============
            // Полное основание (прямоугольник остаётся целиком в проекции)
            ctx.strokeRect(sideX - halfBW, baseY - bH, bW, bH);

            // Цилиндр после среза:
            // — снизу прямоугольник от y=baseHeight до y=yEllipseStart, z ∈ [-cylR, +cylR]
            // — сверху половина эллипса с центром (z=0, y=yEllipseStart) и полуосями (cylR, y2-yEllipseStart)
            const yEllStartCanvas = baseY - yEllipseStart * scale;
            const ellRy = (y2 - yEllipseStart) * scale;
            ctx.beginPath();
            // нижний прямоугольник + дуга эллипса в одном контуре
            ctx.moveTo(sideX - halfCW, baseY - bH);                // низ-лево
            ctx.lineTo(sideX + halfCW, baseY - bH);                // низ-право
            ctx.lineTo(sideX + halfCW, yEllStartCanvas);           // вверх по правой стороне до начала эллипса
            // верхняя половина эллипса от правой точки через верх к левой
            ctx.ellipse(sideX, yEllStartCanvas, halfCW, ellRy, 0, 0, Math.PI, true);
            ctx.lineTo(sideX - halfCW, baseY - bH);                // вниз по левой стороне обратно
            ctx.stroke();

            ctx.shadowBlur = 0;
        }

        drawSection4();

    </script>
