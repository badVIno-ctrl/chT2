<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Черчение - 3 Вида и 3D с Сечением</title>
    <style>
        :root {
            --neon: #bf00ff;
            --bg: #050505;
            --accent: #00ffff;
            --red: #ff3333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(191, 0, 255, 0.14), transparent 34%),
                radial-gradient(circle at bottom right, rgba(255, 51, 51, 0.08), transparent 28%),
                var(--bg);
            color: #fff;
            font-family: "Segoe UI", Tahoma, sans-serif;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        h2 {
            margin: 0 0 30px;
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--neon);
            text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon);
        }

        .glass-panel {
            background: rgba(20, 20, 20, 0.42);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(191, 0, 255, 0.28);
            border-radius: 18px;
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.48),
                inset 0 0 24px rgba(191, 0, 255, 0.06);
            padding: 22px;
            margin-bottom: 40px;
        }

        #canvas3d {
            width: 100%;
            height: 500px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(191, 0, 255, 0.45);
            box-shadow: 0 0 18px rgba(191, 0, 255, 0.26);
        }

        .canvas-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            overflow-x: auto;
        }

        canvas#view2d {
            background: transparent;
            max-width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: crosshair;
        }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div class="container">
        <div class="glass-panel">
            <h2>1. 3D-модель с сечением</h2>
            <div id="canvas3d"></div>
        </div>

        <div class="glass-panel">
            <h2>2. Ортогональные проекции</h2>
            <div class="canvas-wrapper">
                <canvas id="view2d" width="800" height="700"></canvas>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- СЕКЦИЯ 1: 3D-сцена ---
        const container3d = document.getElementById('canvas3d');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);

        const camera = new THREE.PerspectiveCamera(45, 1, 1, 1000);
        camera.position.set(155, 145, 215);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container3d.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, 0);
        controls.minDistance = 120;
        controls.maxDistance = 420;

        const baseSize = 60;
        const baseHeight = 35;
        const cylRadius = 25;
        const cylHeight = 65;
        const baseHalfDiagonal = baseSize * Math.SQRT2 / 2;

        const edgeMaterial = new THREE.LineBasicMaterial({
            color: 0xbf00ff,
            transparent: true,
            opacity: 0.95,
            depthWrite: false,
            depthTest: false
        });

        const sectionFillMaterial = new THREE.MeshBasicMaterial({
            color: 0xff2f2f,
            transparent: true,
            opacity: 0.52,
            side: THREE.DoubleSide,
            depthWrite: false,
            depthTest: false
        });

        const sectionFrameMaterial = new THREE.LineBasicMaterial({
            color: 0xff4b4b,
            transparent: true,
            opacity: 1,
            depthWrite: false,
            depthTest: false
        });

        function createShellMaterials() {
            return {
                back: new THREE.MeshBasicMaterial({
                    color: 0x050505,
                    transparent: true,
                    opacity: 0.16,
                    side: THREE.BackSide,
                    depthWrite: false
                }),
                front: new THREE.MeshBasicMaterial({
                    color: 0x050505,
                    transparent: true,
                    opacity: 0.28,
                    side: THREE.FrontSide,
                    depthWrite: false
                })
            };
        }

        function buildGhostSolid(geometry, edgeGeometry = geometry, edgeThreshold) {
            const shell = new THREE.Group();
            const materials = createShellMaterials();

            const backMesh = new THREE.Mesh(geometry, materials.back);
            backMesh.renderOrder = 2;
            shell.add(backMesh);

            const frontMesh = new THREE.Mesh(geometry, materials.front);
            frontMesh.renderOrder = 2.1;
            shell.add(frontMesh);

            const edges = new THREE.LineSegments(
                new THREE.EdgesGeometry(edgeGeometry, edgeThreshold),
                edgeMaterial
            );
            edges.renderOrder = 4;
            shell.add(edges);

            return shell;
        }

        function createSectionGeometry(center, along, length, depth) {
            const across = new THREE.Vector3(0, 0, 1);
            const halfLength = length / 2;
            const halfDepth = depth / 2;

            const p1 = center.clone()
                .addScaledVector(along, -halfLength)
                .addScaledVector(across, -halfDepth);
            const p2 = center.clone()
                .addScaledVector(along, halfLength)
                .addScaledVector(across, -halfDepth);
            const p3 = center.clone()
                .addScaledVector(along, halfLength)
                .addScaledVector(across, halfDepth);
            const p4 = center.clone()
                .addScaledVector(along, -halfLength)
                .addScaledVector(across, halfDepth);

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute([
                p1.x, p1.y, p1.z,
                p2.x, p2.y, p2.z,
                p3.x, p3.y, p3.z,
                p4.x, p4.y, p4.z
            ], 3));
            geometry.setIndex([0, 1, 2, 0, 2, 3]);
            geometry.computeVertexNormals();

            return { geometry, corners: [p1, p2, p3, p4] };
        }

        const modelGroup = new THREE.Group();

        const baseGeometry = new THREE.BoxGeometry(baseSize, baseHeight, baseSize);
        const baseSolid = buildGhostSolid(baseGeometry);
        baseSolid.position.y = baseHeight / 2;
        baseSolid.rotation.y = Math.PI / 4;
        modelGroup.add(baseSolid);

        const cylinderGeometry = new THREE.CylinderGeometry(cylRadius, cylRadius, cylHeight, 48);
        const cylinderSolid = buildGhostSolid(cylinderGeometry, cylinderGeometry, 15);
        cylinderSolid.position.y = baseHeight + cylHeight / 2;
        modelGroup.add(cylinderSolid);

        const x1 = -baseHalfDiagonal;
        const y1 = baseHeight / 2;
        const x2 = cylRadius;
        const y2 = baseHeight + cylHeight / 2;

        const sectionCenter = new THREE.Vector3((x1 + x2) / 2, (y1 + y2) / 2, 0);
        const sectionDirection = new THREE.Vector3(x2 - x1, y2 - y1, 0).normalize();
        const sectionLength = Math.hypot(x2 - x1, y2 - y1) + 4;
        const sectionDepth = baseSize * Math.SQRT2 + 4;

        const { geometry: sectionGeometry, corners: sectionCorners } = createSectionGeometry(
            sectionCenter,
            sectionDirection,
            sectionLength,
            sectionDepth
        );

        const sectionMesh = new THREE.Mesh(sectionGeometry, sectionFillMaterial);
        sectionMesh.renderOrder = 1;
        modelGroup.add(sectionMesh);

        const sectionFrame = new THREE.LineLoop(
            new THREE.BufferGeometry().setFromPoints(sectionCorners),
            sectionFrameMaterial
        );
        sectionFrame.renderOrder = 5;
        modelGroup.add(sectionFrame);

        const pointSphere = new THREE.Mesh(
            new THREE.SphereGeometry(3, 20, 20),
            new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                depthWrite: false,
                depthTest: false
            })
        );
        pointSphere.renderOrder = 6;
        pointSphere.visible = false;
        modelGroup.add(pointSphere);

        modelGroup.position.y = -(baseHeight + cylHeight) / 2;
        scene.add(modelGroup);

        function resize3D() {
            const width = container3d.clientWidth || 1;
            const height = container3d.clientHeight || 1;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height, false);
        }

        const resizeObserver = new ResizeObserver(resize3D);
        resizeObserver.observe(container3d);
        window.addEventListener('resize', resize3D);
        resize3D();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- СЕКЦИЯ 2: 2D-чертеж и интерактивность ---
        const canvas = document.getElementById('view2d');
        const ctx = canvas.getContext('2d');

        const neonColor = '#bf00ff';
        const axisColor = 'rgba(255, 255, 255, 0.4)';
        const projColor = 'rgba(255, 255, 255, 0.15)';

        const cx = 400;
        const cy = 350;
        const scale = 1.5;

        const bW = baseSize * Math.SQRT2 * scale;
        const bH = baseHeight * scale;
        const cW = cylRadius * 2 * scale;
        const cH = cylHeight * scale;
        const halfBW = bW / 2;
        const halfCW = cW / 2;

        const frontX = cx - 180;
        const topY = cy + 150;
        const sideX = cx + 150;
        const baseY = cy - 40;

        const secX1 = x1 * scale;
        const secY1 = y1 * scale;
        const secX2 = x2 * scale;
        const secY2 = y2 * scale;
        const projDepth = halfBW;

        let activePoint = null;

        function draw2D() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.strokeStyle = axisColor;
            ctx.lineWidth = 1;
            ctx.moveTo(0, cy);
            ctx.lineTo(canvas.width, cy);
            ctx.moveTo(cx, 0);
            ctx.lineTo(cx, canvas.height);
            ctx.stroke();

            ctx.fillStyle = axisColor;
            ctx.font = '14px Arial';
            ctx.fillText('X', 20, cy - 10);
            ctx.fillText('Z', cx + 10, 20);
            ctx.fillText('Y', cx + 10, canvas.height - 20);
            ctx.fillText('Y', canvas.width - 20, cy - 10);

            ctx.beginPath();
            ctx.strokeStyle = projColor;
            ctx.setLineDash([5, 5]);
            ctx.moveTo(frontX, baseY);
            ctx.lineTo(sideX + halfBW + 20, baseY);
            ctx.moveTo(frontX, baseY - bH);
            ctx.lineTo(sideX + halfBW + 20, baseY - bH);
            ctx.moveTo(frontX, baseY - bH - cH);
            ctx.lineTo(sideX + halfCW + 20, baseY - bH - cH);
            ctx.moveTo(frontX - halfBW, topY);
            ctx.lineTo(frontX - halfBW, baseY - bH);
            ctx.moveTo(frontX + halfBW, topY);
            ctx.lineTo(frontX + halfBW, baseY - bH);
            ctx.arc(cx, cy, 150, 0, Math.PI / 2);
            ctx.moveTo(cx, cy + 150 + halfBW);
            ctx.arc(cx, cy, 150 + halfBW, 0, Math.PI / 2);
            ctx.moveTo(cx, cy + 150 - halfBW);
            ctx.arc(cx, cy, 150 - halfBW, 0, Math.PI / 2);
            ctx.moveTo(sideX, cy);
            ctx.lineTo(sideX, baseY - bH - cH);
            ctx.moveTo(sideX - halfBW, cy);
            ctx.lineTo(sideX - halfBW, baseY - bH);
            ctx.moveTo(sideX + halfBW, cy);
            ctx.lineTo(sideX + halfBW, baseY - bH);
            ctx.stroke();

            ctx.beginPath();
            ctx.strokeStyle = '#888';
            ctx.setLineDash([15, 5, 2, 5]);
            ctx.moveTo(frontX, baseY - bH - cH - 20);
            ctx.lineTo(frontX, topY + halfBW + 20);
            ctx.moveTo(frontX - halfBW - 20, topY);
            ctx.lineTo(frontX + halfBW + 20, topY);
            ctx.moveTo(sideX, baseY - bH - cH - 20);
            ctx.lineTo(sideX, cy + 20);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.strokeStyle = neonColor;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = neonColor;

            ctx.strokeRect(frontX - halfBW, baseY - bH, bW, bH);
            ctx.strokeRect(frontX - halfCW, baseY - bH - cH, cW, cH);

            ctx.beginPath();
            ctx.moveTo(frontX, topY - halfBW);
            ctx.lineTo(frontX + halfBW, topY);
            ctx.lineTo(frontX, topY + halfBW);
            ctx.lineTo(frontX - halfBW, topY);
            ctx.closePath();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(frontX, topY, halfCW, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeRect(sideX - halfBW, baseY - bH, bW, bH);
            ctx.strokeRect(sideX - halfCW, baseY - bH - cH, cW, cH);
            ctx.beginPath();
            ctx.moveTo(sideX, baseY);
            ctx.lineTo(sideX, baseY - bH);
            ctx.moveTo(frontX, baseY);
            ctx.lineTo(frontX, baseY - bH);
            ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(frontX + secX1, baseY - secY1);
            ctx.lineTo(frontX + secX2, baseY - secY2);
            ctx.stroke();

            ctx.fillRect(frontX + secX1, topY - projDepth, secX2 - secX1, projDepth * 2);
            ctx.strokeRect(frontX + secX1, topY - projDepth, secX2 - secX1, projDepth * 2);

            ctx.fillRect(sideX - projDepth, baseY - secY2, projDepth * 2, secY2 - secY1);
            ctx.strokeRect(sideX - projDepth, baseY - secY2, projDepth * 2, secY2 - secY1);

            if (activePoint) {
                const pxFront = frontX + activePoint.x * scale;
                const pyFront = baseY - activePoint.y * scale;
                const pxTop = frontX + activePoint.x * scale;
                const pyTop = topY + activePoint.z * scale;
                const pxSide = sideX + activePoint.z * scale;
                const pySide = baseY - activePoint.y * scale;

                ctx.beginPath();
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.moveTo(pxFront, pyFront);
                ctx.lineTo(pxTop, pyTop);
                ctx.moveTo(pxFront, pyFront);
                ctx.lineTo(pxSide, pySide);
                ctx.moveTo(pxTop, pyTop);
                ctx.lineTo(cx, pyTop);

                const arcRadius = pyTop - cy;
                if (arcRadius > 0) {
                    ctx.arc(cx, cy, arcRadius, Math.PI / 2, 0, true);
                } else {
                    ctx.arc(cx, cy, Math.abs(arcRadius), Math.PI / 2, 0, false);
                }

                ctx.lineTo(pxSide, pySide);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = '#00ffff';
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#00ffff';

                const dots = [
                    [pxFront, pyFront],
                    [pxTop, pyTop],
                    [pxSide, pySide]
                ];

                dots.forEach(([x, y]) => {
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.shadowBlur = 0;
            }
        }

        draw2D();

        // --- Обработка кликов для создания проекционных связей ---
        canvas.addEventListener('click', (event) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;

            let locX = 0;
            let locY = 0;
            let locZ = 0;
            let found = false;
            const margin = 15;

            if (
                mouseX > frontX - halfBW - margin &&
                mouseX < frontX + halfBW + margin &&
                mouseY > baseY - bH - cH - margin &&
                mouseY < baseY + margin
            ) {
                locX = (mouseX - frontX) / scale;
                locY = (baseY - mouseY) / scale;
                locY = Math.max(0, Math.min(100, locY));

                if (locY > baseHeight) {
                    locZ = Math.abs(locX) <= cylRadius ? Math.sqrt(cylRadius ** 2 - locX ** 2) : 0;
                } else {
                    const maxZ = baseHalfDiagonal;
                    locZ = Math.abs(locX) <= maxZ ? maxZ - Math.abs(locX) : 0;
                }
                found = true;
            } else if (
                mouseX > frontX - halfBW - margin &&
                mouseX < frontX + halfBW + margin &&
                mouseY > topY - halfBW - margin &&
                mouseY < topY + halfBW + margin
            ) {
                locX = (mouseX - frontX) / scale;
                locZ = (mouseY - topY) / scale;

                if (locX ** 2 + locZ ** 2 <= cylRadius ** 2) {
                    locY = baseHeight + cylHeight;
                } else if (Math.abs(locX) + Math.abs(locZ) <= baseHalfDiagonal) {
                    locY = baseHeight;
                } else {
                    locY = 0;
                }
                found = true;
            } else if (
                mouseX > sideX - halfBW - margin &&
                mouseX < sideX + halfBW + margin &&
                mouseY > baseY - bH - cH - margin &&
                mouseY < baseY + margin
            ) {
                locZ = (mouseX - sideX) / scale;
                locY = (baseY - mouseY) / scale;
                locY = Math.max(0, Math.min(100, locY));

                if (locY > baseHeight) {
                    locX = Math.abs(locZ) <= cylRadius ? Math.sqrt(cylRadius ** 2 - locZ ** 2) : 0;
                } else {
                    const maxX = baseHalfDiagonal;
                    locX = Math.abs(locZ) <= maxX ? maxX - Math.abs(locZ) : 0;
                }
                found = true;
            }

            if (found) {
                activePoint = { x: locX, y: locY, z: locZ };
                pointSphere.position.set(locX, locY, locZ);
                pointSphere.visible = true;
            } else {
                activePoint = null;
                pointSphere.visible = false;
            }

            draw2D();
        });
    </script>
</body>
</html>
