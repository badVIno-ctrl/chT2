<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Черчение - 3 Вида и 3D с Сечением</title>
    <style>
        :root { --neon: #bf00ff; --bg: #050505; --accent: #00ffff; --red: #ff3333; }
        body { 
            margin: 0; 
            background-color: var(--bg); 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            overflow-x: hidden; 
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
        }
        h1, h2 { 
            text-align: center; 
            font-weight: 300; 
            letter-spacing: 2px; 
            color: var(--neon); 
            text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon); 
        }
        .instruction {
            text-align: center;
            color: var(--accent);
            font-size: 1.1em;
            margin-bottom: 20px;
            text-shadow: 0 0 8px var(--accent);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        .glass-panel { 
            background: rgba(20, 20, 20, 0.4); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            border: 1px solid rgba(191, 0, 255, 0.3); 
            border-radius: 16px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(191, 0, 255, 0.05); 
            padding: 20px; 
            margin-bottom: 40px; 
        }
        #canvas3d { 
            width: 100%; 
            height: 500px; 
            border-radius: 8px; 
            overflow: hidden; 
            position: relative; 
            border: 1px solid rgba(191, 0, 255, 0.5); 
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.3); 
        }
        .canvas-wrapper { 
            display: flex; 
            justify-content: center; 
            width: 100%; 
            overflow-x: auto; 
        }
        canvas#view2d { 
            background: transparent; 
            max-width: 100%; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 8px; 
            cursor: crosshair;
        }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div class="container">
        <h1>Деталь: Цилиндр на призме</h1>
        
        <div class="glass-panel">
            <h2>1. 3D-модель с Сечением</h2>
            <div id="canvas3d"></div>
        </div>

        <div class="glass-panel">
            <h2>2. Ортогональные проекции (Интерактивные)</h2>
            <p class="instruction">💡 Кликните на любую точку детали на чертеже, чтобы увидеть проекционные связи!</p>
            <div class="canvas-wrapper">
                <canvas id="view2d" width="800" height="700"></canvas>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- СЕКЦИЯ 1: 3D Сцена ---
        const container3d = document.getElementById('canvas3d');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);

        const camera = new THREE.PerspectiveCamera(45, container3d.clientWidth / container3d.clientHeight, 1, 1000);
        camera.position.set(150, 150, 200);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container3d.clientWidth, container3d.clientHeight);
        container3d.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Размеры из чертежа
        const baseSize = 60;
        const baseHeight = 35;
        const cylRadius = 25; 
        const cylHeight = 65; 
        
        const invisibleMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.8 });
        const edgeMat = new THREE.LineBasicMaterial({ color: 0xbf00ff, linewidth: 2 });

        const group = new THREE.Group();

        // 1. Основание (Призма)
        const baseGeo = new THREE.BoxGeometry(baseSize, baseHeight, baseSize);
        const baseMesh = new THREE.Mesh(baseGeo, invisibleMat);
        baseMesh.position.y = baseHeight / 2;
        baseMesh.rotation.y = Math.PI / 4;
        baseMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(baseGeo), edgeMat));
        group.add(baseMesh);

        // 2. Цилиндр
        const cylGeo = new THREE.CylinderGeometry(cylRadius, cylRadius, cylHeight, 32);
        const cylMesh = new THREE.Mesh(cylGeo, invisibleMat);
        cylMesh.position.y = baseHeight + cylHeight / 2; 
        cylMesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(cylGeo, 15), edgeMat));
        group.add(cylMesh);

        // 3. Секущая плоскость (Красная)
        // Координаты по условию: от левой грани основания (середина высоты) до правой грани цилиндра (середина высоты)
        const x1 = - (baseSize * Math.sqrt(2) / 2); // Левый край ромба ~ -42.425
        const y1 = baseHeight / 2;                 // Середина основания = 17.5
        const x2 = cylRadius;                      // Правый край цилиндра = 25
        const y2 = baseHeight + cylHeight / 2;     // Середина цилиндра = 67.5

        const secWidth = baseSize * Math.sqrt(2); // Глубина (по Z)
        const secHeight = Math.hypot(x2 - x1, y2 - y1); // Длина наклонной линии
        
        const sectionGeo = new THREE.PlaneGeometry(secWidth, secHeight);
        const sectionMat = new THREE.MeshBasicMaterial({ 
            color: 0xff0000, transparent: true, opacity: 0.35, side: THREE.DoubleSide 
        });
        const sectionMesh = new THREE.Mesh(sectionGeo, sectionMat);
        
        // Позиционируем в центр отрезка сечения
        const midX = (x1 + x2) / 2;
        const midY = (y1 + y2) / 2;
        sectionMesh.position.set(midX, midY, 0);
        
        // Поворачиваем плоскость (ориентируем по нормали к линии сечения)
        const dx = x2 - x1;
        const dy = y2 - y1;
        sectionMesh.lookAt(midX - dy, midY + dx, 0);

        // Добавляем яркую красную рамку для сечения
        const secEdges = new THREE.LineSegments(
            new THREE.EdgesGeometry(sectionGeo), 
            new THREE.LineBasicMaterial({ color: 0xff3333, linewidth: 3 })
        );
        sectionMesh.add(secEdges);
        group.add(sectionMesh);

        // 4. Интерактивная светящаяся точка (изначально скрыта)
        const pointGeo = new THREE.SphereGeometry(3, 16, 16);
        const pointMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const pointSphere = new THREE.Mesh(pointGeo, pointMat);
        pointSphere.visible = false;
        group.add(pointSphere);

        group.position.y = - (baseHeight + cylHeight) / 2;
        scene.add(group);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- СЕКЦИЯ 2: 2D Чертеж и Интерактивность ---
        const canvas = document.getElementById('view2d');
        const ctx = canvas.getContext('2d');
        
        const neonColor = '#bf00ff';
        const axisColor = 'rgba(255, 255, 255, 0.4)';
        const projColor = 'rgba(255, 255, 255, 0.15)';
        
        const cx = 400, cy = 350; // Центр
        const scale = 1.5;
        
        const bW = baseSize * Math.sqrt(2) * scale; // Ширина ромба ~84.85 * 1.5
        const bH = baseHeight * scale;    
        const cW = cylRadius * 2 * scale;    
        const cH = cylHeight * scale;    
        const halfBW = bW / 2;
        const halfCW = cW / 2;

        const frontX = cx - 180, topY = cy + 150, sideX = cx + 150, baseY = cy - 40; 
        
        // Координаты сечения для 2D
        const secX1 = x1 * scale, secY1 = y1 * scale;
        const secX2 = x2 * scale, secY2 = y2 * scale;
        const secDepth = halfBW; // Максимальная глубина

        let activePoint = null; // Хранит {x, y, z} кликнутой точки

        function draw2D() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Оси
            ctx.beginPath();
            ctx.strokeStyle = axisColor;
            ctx.lineWidth = 1;
            ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); 
            ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); 
            ctx.stroke();
            
            ctx.fillStyle = axisColor;
            ctx.font = '14px Arial';
            ctx.fillText('X', 20, cy - 10); ctx.fillText('Z', cx + 10, 20);
            ctx.fillText('Y', cx + 10, canvas.height - 20); ctx.fillText('Y', canvas.width - 20, cy - 10);

            // 2. Линии связи (штриховка)
            ctx.beginPath();
            ctx.strokeStyle = projColor;
            ctx.setLineDash([5, 5]);
            ctx.moveTo(frontX, baseY); ctx.lineTo(sideX + halfBW + 20, baseY);
            ctx.moveTo(frontX, baseY - bH); ctx.lineTo(sideX + halfBW + 20, baseY - bH);
            ctx.moveTo(frontX, baseY - bH - cH); ctx.lineTo(sideX + halfCW + 20, baseY - bH - cH);
            ctx.moveTo(frontX - halfBW, topY); ctx.lineTo(frontX - halfBW, baseY - bH);
            ctx.moveTo(frontX + halfBW, topY); ctx.lineTo(frontX + halfBW, baseY - bH);
            ctx.arc(cx, cy, 150, 0, Math.PI/2); 
            ctx.moveTo(cx, cy + 150 + halfBW); ctx.arc(cx, cy, 150 + halfBW, 0, Math.PI/2);
            ctx.moveTo(cx, cy + 150 - halfBW); ctx.arc(cx, cy, 150 - halfBW, 0, Math.PI/2);
            ctx.moveTo(sideX, cy); ctx.lineTo(sideX, baseY - bH - cH);
            ctx.moveTo(sideX - halfBW, cy); ctx.lineTo(sideX - halfBW, baseY - bH);
            ctx.moveTo(sideX + halfBW, cy); ctx.lineTo(sideX + halfBW, baseY - bH);
            ctx.stroke();

            // Осевые линии (штрихпунктир)
            ctx.beginPath();
            ctx.strokeStyle = '#888';
            ctx.setLineDash([15, 5, 2, 5]);
            ctx.moveTo(frontX, baseY - bH - cH - 20); ctx.lineTo(frontX, topY + halfBW + 20); 
            ctx.moveTo(frontX - halfBW - 20, topY); ctx.lineTo(frontX + halfBW + 20, topY); 
            ctx.moveTo(sideX, baseY - bH - cH - 20); ctx.lineTo(sideX, cy + 20); 
            ctx.stroke();
            ctx.setLineDash([]);

            // 3. Отрисовка проекций (Неон)
            ctx.strokeStyle = neonColor;
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = neonColor;

            // Вид спереди
            ctx.strokeRect(frontX - halfBW, baseY - bH, bW, bH); 
            ctx.strokeRect(frontX - halfCW, baseY - bH - cH, cW, cH); 

            // Вид сверху
            ctx.beginPath(); 
            ctx.moveTo(frontX, topY - halfBW); ctx.lineTo(frontX + halfBW, topY);
            ctx.lineTo(frontX, topY + halfBW); ctx.lineTo(frontX - halfBW, topY);
            ctx.closePath(); ctx.stroke();
            ctx.beginPath(); ctx.arc(frontX, topY, halfCW, 0, Math.PI * 2); ctx.stroke();

            // Вид слева
            ctx.strokeRect(sideX - halfBW, baseY - bH, bW, bH); 
            ctx.strokeRect(sideX - halfCW, baseY - bH - cH, cW, cH); 
            ctx.beginPath();
            ctx.moveTo(sideX, baseY); ctx.lineTo(sideX, baseY - bH);
            ctx.moveTo(frontX, baseY); ctx.lineTo(frontX, baseY - bH);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // 4. Отрисовка сечения на 3-х видах
            ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = 2;

            // Спереди (Линия)
            ctx.beginPath();
            ctx.moveTo(frontX + secX1, baseY - secY1);
            ctx.lineTo(frontX + secX2, baseY - secY2);
            ctx.stroke();

            // Сверху (Проекция плоскости - Прямоугольник)
            ctx.fillRect(frontX + secX1, topY - secDepth, secX2 - secX1, secDepth * 2);
            ctx.strokeRect(frontX + secX1, topY - secDepth, secX2 - secX1, secDepth * 2);

            // Слева (Проекция плоскости - Прямоугольник)
            ctx.fillRect(sideX - secDepth, baseY - secY2, secDepth * 2, secY2 - secY1);
            ctx.strokeRect(sideX - secDepth, baseY - secY2, secDepth * 2, secY2 - secY1);

            // 5. Отрисовка интерактивной точки и связей
            if (activePoint) {
                const px_f = frontX + activePoint.x * scale;
                const py_f = baseY - activePoint.y * scale;
                const px_t = frontX + activePoint.x * scale;
                const py_t = topY + activePoint.z * scale;
                const px_s = sideX + activePoint.z * scale;
                const py_s = baseY - activePoint.y * scale;

                // Линии проекционной связи
                ctx.beginPath();
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);

                ctx.moveTo(px_f, py_f); ctx.lineTo(px_t, py_t); // Спереди -> Сверху
                ctx.moveTo(px_f, py_f); ctx.lineTo(px_s, py_s); // Спереди -> Слева
                
                // Связь Сверху -> Слева (через дугу)
                ctx.moveTo(px_t, py_t); 
                ctx.lineTo(cx, py_t);
                const arcRadius = py_t - cy;
                if (arcRadius > 0) ctx.arc(cx, cy, arcRadius, Math.PI/2, 0, true);
                else ctx.arc(cx, cy, Math.abs(arcRadius), Math.PI/2, 0, false);
                ctx.lineTo(px_s, py_s);

                ctx.stroke();
                ctx.setLineDash([]);

                // Светящиеся точки
                ctx.fillStyle = '#00ffff';
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#00ffff';
                const dots = [[px_f, py_f], [px_t, py_t], [px_s, py_s]];
                dots.forEach(([x, y]) => {
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.shadowBlur = 0;
            }
        }

        draw2D();

        // --- Обработка кликов для создания проекционных связей ---
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            let locX = 0, locY = 0, locZ = 0;
            let found = false;
            const m = 15; // Погрешность клика

            // Проверка: Вид спереди
            if (mouseX > frontX - halfBW - m && mouseX < frontX + halfBW + m &&
                mouseY > baseY - bH - cH - m && mouseY < baseY + m) {
                locX = (mouseX - frontX) / scale;
                locY = (baseY - mouseY) / scale;
                locY = Math.max(0, Math.min(100, locY));
                
                // Вычисляем Z (глубину) в зависимости от того, куда кликнули
                if (locY > baseHeight) {
                    locZ = (Math.abs(locX) <= cylRadius) ? Math.sqrt(cylRadius**2 - locX**2) : 0;
                } else {
                    const maxZ = baseSize * Math.sqrt(2) / 2;
                    locZ = (Math.abs(locX) <= maxZ) ? maxZ - Math.abs(locX) : 0;
                }
                found = true;
            }
            // Проверка: Вид сверху
            else if (mouseX > frontX - halfBW - m && mouseX < frontX + halfBW + m &&
                     mouseY > topY - halfBW - m && mouseY < topY + halfBW + m) {
                locX = (mouseX - frontX) / scale;
                locZ = (mouseY - topY) / scale;
                
                if (locX**2 + locZ**2 <= cylRadius**2) locY = baseHeight + cylHeight;
                else if (Math.abs(locX) + Math.abs(locZ) <= baseSize * Math.sqrt(2) / 2) locY = baseHeight;
                else locY = 0;
                found = true;
            }
            // Проверка: Вид слева
            else if (mouseX > sideX - halfBW - m && mouseX < sideX + halfBW + m &&
                     mouseY > baseY - bH - cH - m && mouseY < baseY + m) {
                locZ = (mouseX - sideX) / scale;
                locY = (baseY - mouseY) / scale;
                locY = Math.max(0, Math.min(100, locY));
                
                if (locY > baseHeight) {
                    locX = (Math.abs(locZ) <= cylRadius) ? Math.sqrt(cylRadius**2 - locZ**2) : 0;
                } else {
                    const maxX = baseSize * Math.sqrt(2) / 2;
                    locX = (Math.abs(locZ) <= maxX) ? maxX - Math.abs(locZ) : 0;
                }
                found = true;
            }

            if (found) {
                activePoint = { x: locX, y: locY, z: locZ };
                pointSphere.position.set(locX, locY, locZ);
                pointSphere.visible = true;
            } else {
                activePoint = null;
                pointSphere.visible = false;
            }
            draw2D();
        });
    </script>
</body>
  </html>
